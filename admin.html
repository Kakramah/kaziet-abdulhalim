<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>تحديث حالة الوقود — كازية عبد الحليم</title>
    <style>
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Tajawal'; src: url('fonts/Tajawal-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
        :root { --bg:#0B0F17; --surface:#131B2A; --elevated:#1E293B; --text:#F8FAFC; --muted:#94A3B8; --yellow:#FACC15; --green:#22C55E; --red:#EF4444; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; font-weight:500; min-height:100vh; padding:1.25rem; }
        main { max-width:460px; margin:0 auto; }
        h1 { font-family:'Cairo',sans-serif; font-size:1.4rem; margin:0 0 .25rem; color:var(--yellow); }
        p.lead { color:var(--muted); margin:0 0 1.5rem; font-size:.95rem; }
        .card { background:var(--surface); border:1px solid var(--elevated); border-radius:16px; padding:1rem; margin-bottom:1rem; }
        .card h2 { font-family:'Cairo',sans-serif; font-size:1.1rem; margin:0 0 .75rem; }
        .pair { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
        .opt { font:inherit; font-size:1.05rem; padding:1rem .5rem; border-radius:12px; border:2px solid var(--elevated); background:var(--elevated); color:var(--text); cursor:pointer; min-height:56px; }
        .opt[aria-pressed="true"].yes { border-color:var(--green); background:rgba(34,197,94,.18); }
        .opt[aria-pressed="true"].no { border-color:var(--red); background:rgba(239,68,68,.18); }
        label.f { display:block; color:var(--muted); font-size:.9rem; margin-bottom:.4rem; }
        input[type=password] { width:100%; font:inherit; font-size:1rem; padding:.85rem; border-radius:12px; border:1px solid var(--elevated); background:var(--bg); color:var(--text); }
        .remember { display:flex; gap:.5rem; align-items:center; margin-top:.7rem; color:var(--muted); font-size:.9rem; }
        button.publish { width:100%; font-family:'Cairo',sans-serif; font-size:1.1rem; padding:1rem; border:0; border-radius:12px; background:var(--yellow); color:#0B0F17; cursor:pointer; min-height:56px; }
        button.publish:disabled { opacity:.6; cursor:wait; }
        #msg { min-height:1.5rem; margin-top:1rem; text-align:center; font-size:.95rem; }
        #msg.ok { color:#4ADE80; } #msg.err { color:#F87171; }
        #last { color:var(--muted); font-size:.85rem; text-align:center; margin-top:.5rem; }
    </style>
</head>
<body>
<main>
    <h1>تحديث حالة الوقود</h1>
    <p class="lead">اختر حالة كل مادة ثم اضغط «نشر الحالة». تظهر فوراً في الموقع.</p>

    <section class="card" aria-labelledby="h-g">
        <h2 id="h-g">بنزين</h2>
        <div class="pair">
            <button type="button" class="opt yes" data-fuel="gasoline" data-value="available" aria-pressed="false">متوفر</button>
            <button type="button" class="opt no" data-fuel="gasoline" data-value="unavailable" aria-pressed="false">نفد</button>
        </div>
    </section>

    <section class="card" aria-labelledby="h-d">
        <h2 id="h-d">مازوت</h2>
        <div class="pair">
            <button type="button" class="opt yes" data-fuel="diesel" data-value="available" aria-pressed="false">متوفر</button>
            <button type="button" class="opt no" data-fuel="diesel" data-value="unavailable" aria-pressed="false">نفد</button>
        </div>
    </section>

    <section class="card">
        <label class="f" for="pw">كلمة السر</label>
        <input type="password" id="pw" autocomplete="current-password">
        <label class="remember"><input type="checkbox" id="remember"> تذكّر على هذا الجهاز</label>
    </section>

    <button type="button" class="publish" id="publish">نشر الحالة</button>
    <div id="msg" role="status" aria-live="polite"></div>
    <div id="last"></div>
</main>

<script src="config.js"></script>
<script>
(function () {
    const STATUS_URL = (window.KAZIET_CONFIG && window.KAZIET_CONFIG.statusUrl) || '';
    const state = { gasoline: null, diesel: null };
    const msg = document.getElementById('msg');
    const last = document.getElementById('last');
    const pw = document.getElementById('pw');
    const remember = document.getElementById('remember');
    const btn = document.getElementById('publish');

    try {
        const saved = localStorage.getItem('kaziet_admin_pw');
        if (saved) { pw.value = saved; remember.checked = true; }
    } catch (e) {}

    function say(text, cls) { msg.textContent = text; msg.className = cls || ''; }

    function paint() {
        document.querySelectorAll('.opt').forEach(b => {
            b.setAttribute('aria-pressed', String(state[b.dataset.fuel] === b.dataset.value));
        });
    }

    document.querySelectorAll('.opt').forEach(b => {
        b.addEventListener('click', () => {
            state[b.dataset.fuel] = b.dataset.value;
            say('');
            paint();
        });
    });

    function configured() { return !!STATUS_URL; }

    async function loadCurrent() {
        if (!configured()) { say('رابط الخدمة غير مضبوط بعد في ملف config.js.', 'err'); return; }
        try {
            const res = await fetch(`${STATUS_URL}?t=${Date.now()}`, { cache: 'no-store' });
            const d = await res.json();
            ['gasoline', 'diesel'].forEach(k => {
                if (d[k] === 'available' || d[k] === 'unavailable') state[k] = d[k];
            });
            if (d.updatedAt) last.textContent = 'آخر نشر: ' + new Date(Number(d.updatedAt)).toLocaleString('ar-SY');
            paint();
        } catch (e) {
            say('تعذّر جلب الحالة الحالية. تحقق من الاتصال.', 'err');
        }
    }

    btn.addEventListener('click', async () => {
        if (!configured()) { say('رابط الخدمة غير مضبوط بعد في ملف config.js.', 'err'); return; }
        if (!state.gasoline || !state.diesel) { say('اختر حالة البنزين والمازوت أولاً.', 'err'); return; }
        if (!pw.value) { say('أدخل كلمة السر.', 'err'); return; }

        btn.disabled = true;
        say('جارٍ النشر…');
        try {
            const res = await fetch(STATUS_URL, {
                method: 'POST',
                body: JSON.stringify({ password: pw.value, gasoline: state.gasoline, diesel: state.diesel })
            });
            const d = await res.json();
            if (d.ok) {
                try {
                    if (remember.checked) localStorage.setItem('kaziet_admin_pw', pw.value);
                    else localStorage.removeItem('kaziet_admin_pw');
                } catch (e) {}
                say('تم النشر. الحالة ظاهرة الآن في الموقع.', 'ok');
                last.textContent = 'آخر نشر: ' + new Date(Number(d.updatedAt)).toLocaleString('ar-SY');
            } else if (d.error === 'unauthorized') {
                say('كلمة السر غير صحيحة.', 'err');
            } else {
                say('لم يُقبل الطلب. حاول مرة أخرى.', 'err');
            }
        } catch (e) {
            say('تعذّر الاتصال. لم تُنشر الحالة، أعد المحاولة.', 'err');
        } finally {
            btn.disabled = false;
        }
    });

    loadCurrent();
})();
</script>
</body>
</html>
