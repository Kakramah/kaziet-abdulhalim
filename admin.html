<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة — كازية عبد الحليم</title>
    <style>
        @font-face { font-family: 'Cairo'; src: url('fonts/Cairo-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Tajawal'; src: url('fonts/Tajawal-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }
        :root { --bg:#0B0F17; --surface:#131B2A; --elevated:#1E293B; --text:#F8FAFC; --muted:#94A3B8; --yellow:#FACC15; --green:#22C55E; --red:#EF4444; }
        * { box-sizing: border-box; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh; padding:1.25rem; }
        main { max-width:600px; margin:0 auto; }
        h1, h2 { font-family:'Cairo',sans-serif; color:var(--yellow); margin-top: 0; }
        h1 { font-size:1.6rem; margin-bottom: 0.5rem; text-align: center; }
        .card { background:var(--surface); border:1px solid var(--elevated); border-radius:16px; padding:1.5rem; margin-bottom:1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display:block; color:var(--muted); font-size:.9rem; margin-bottom:.5rem; }
        input[type=email], input[type=password], input[type=text], input[type=file] { width:100%; font:inherit; padding:.85rem; border-radius:12px; border:1px solid var(--elevated); background:var(--bg); color:var(--text); }
        .btn { width:100%; font-family:'Cairo',sans-serif; font-size:1.1rem; padding:1rem; border:0; border-radius:12px; background:var(--yellow); color:#0B0F17; cursor:pointer; font-weight: bold; transition: opacity 0.2s; }
        .btn:disabled { opacity:.6; cursor:not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--yellow); color: var(--yellow); }
        .pair { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom: 1rem;}
        .opt { font:inherit; font-size:1.05rem; padding:1rem .5rem; border-radius:12px; border:2px solid var(--elevated); background:var(--elevated); color:var(--text); cursor:pointer; transition: all 0.2s;}
        .opt.active.yes { border-color:var(--green); background:rgba(34,197,94,.18); }
        .opt.active.no { border-color:var(--red); background:rgba(239,68,68,.18); }
        .hidden { display: none !important; }
        #msg { text-align:center; font-size:.95rem; margin-bottom: 1rem; min-height: 20px; font-weight: bold;}
        .ok { color:#4ADE80; } .err { color:#F87171; }
        .img-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid var(--elevated); }
    </style>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
</head>
<body>

<main>
    <h1>لوحة الإدارة (CMS)</h1>
    
    <div id="msg" class=""></div>

    <!-- Login Section -->
    <section id="login-section" class="card">
        <h2>تسجيل الدخول للمدير</h2>
        <div class="form-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="login-email" placeholder="admin@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>كلمة السر</label>
            <input type="password" id="login-pw" autocomplete="current-password">
        </div>
        <button class="btn" id="btn-login">تسجيل الدخول</button>
    </section>

    <!-- Dashboard Section -->
    <div id="dashboard-section" class="hidden">
        
        <!-- Fuel Status -->
        <section class="card">
            <h2>حالة الوقود (تحديث فوري)</h2>
            <label>البنزين</label>
            <div class="pair">
                <button class="opt yes" data-fuel="gasoline" data-value="available">متوفر</button>
                <button class="opt no" data-fuel="gasoline" data-value="unavailable">نفد</button>
            </div>
            <label>المازوت</label>
            <div class="pair">
                <button class="opt yes" data-fuel="diesel" data-value="available">متوفر</button>
                <button class="opt no" data-fuel="diesel" data-value="unavailable">نفد</button>
            </div>
            <button class="btn" id="btn-update-fuel">نشر حالة الوقود</button>
        </section>

        <!-- Media Manager -->
        <section class="card">
            <h2>مدير الوسائط (تغيير صورة الواجهة)</h2>
            <div class="form-group">
                <label>اختر صورة جديدة لكازية عبد الحليم</label>
                <input type="file" id="hero-image-upload" accept="image/*">
                <img id="img-preview" class="img-preview" alt="معاينة الصورة">
            </div>
            <div style="display:flex; gap:0.5rem;">
                <button class="btn" id="btn-upload-image">رفع وتغيير الصورة</button>
                <button class="btn btn-outline" id="btn-revert-image" style="display:none; border-color:var(--red); color:var(--red);">حذف والعودة للفيديو</button>
            </div>
        </section>

        <button class="btn btn-outline" id="btn-logout" style="margin-top: 1rem;">تسجيل الخروج</button>
    </div>

</main>

<script>
    // Initialize Supabase Client using config.js
    const { createClient } = supabase;
    const client = createClient(window.KAZIET_CONFIG.supabaseUrl, window.KAZIET_CONFIG.supabaseKey);

    const UI = {
        loginSec: document.getElementById('login-section'),
        dashSec: document.getElementById('dashboard-section'),
        msg: document.getElementById('msg'),
        email: document.getElementById('login-email'),
        pw: document.getElementById('login-pw'),
        btnLogin: document.getElementById('btn-login'),
        btnLogout: document.getElementById('btn-logout'),
        opts: document.querySelectorAll('.opt'),
        btnFuel: document.getElementById('btn-update-fuel'),
        fileInput: document.getElementById('hero-image-upload'),
        imgPreview: document.getElementById('img-preview'),
        btnUpload: document.getElementById('btn-upload-image'),
        btnRevert: document.getElementById('btn-revert-image')
    };

    let fuelState = { gasoline: 'available', diesel: 'available' };

    function showMsg(text, type='ok') {
        UI.msg.textContent = text;
        UI.msg.className = type;
        setTimeout(() => UI.msg.textContent = '', 4000);
    }

    // 1. Auth Management
    async function checkUser() {
        const { data: { session } } = await client.auth.getSession();
        if (session) {
            UI.loginSec.classList.add('hidden');
            UI.dashSec.classList.remove('hidden');
            loadData(); // Load data from DB once logged in
        } else {
            UI.loginSec.classList.remove('hidden');
            UI.dashSec.classList.add('hidden');
        }
    }

    UI.btnLogin.onclick = async () => {
        if (!UI.email.value || !UI.pw.value) {
            showMsg('الرجاء إدخال البريد وكلمة السر', 'err');
            return;
        }
        UI.btnLogin.disabled = true;
        showMsg('جارِ الدخول...');
        const { error } = await client.auth.signInWithPassword({
            email: UI.email.value,
            password: UI.pw.value
        });
        if (error) {
            showMsg('خطأ في بيانات الدخول!', 'err');
            console.error(error);
        } else {
            showMsg('تم الدخول بنجاح', 'ok');
            await checkUser();
        }
        UI.btnLogin.disabled = false;
    };

    UI.btnLogout.onclick = async () => {
        await client.auth.signOut();
        checkUser();
    };

    // 2. Load Data from Supabase
    async function loadData() {
        const { data, error } = await client.from('site_content').select('*');
        if (data) {
            data.forEach(row => {
                if (row.id === 'fuel_status' && row.value) {
                    fuelState = row.value;
                    updateButtons();
                }
                if (row.id === 'hero_image' && row.value && row.value.url) {
                    UI.btnRevert.style.display = 'block'; // Show revert button if image exists
                }
            });
        }
    }

    function updateButtons() {
        UI.opts.forEach(b => {
            if (fuelState[b.dataset.fuel] === b.dataset.value) {
                b.classList.add('active');
            } else {
                b.classList.remove('active');
            }
        });
    }

    UI.opts.forEach(b => {
        b.onclick = () => {
            fuelState[b.dataset.fuel] = b.dataset.value;
            updateButtons();
        };
    });

    UI.btnFuel.onclick = async () => {
        UI.btnFuel.disabled = true;
        showMsg('جارِ النشر...');
        
        // Upsert allows insert if not exists, or update if exists
        const { error } = await client.from('site_content').upsert({ 
            id: 'fuel_status', 
            value: fuelState 
        });
        
        if (error) {
            showMsg('فشل التحديث: ' + error.message, 'err');
        } else {
            showMsg('تم تحديث حالة الوقود بنجاح وتطبيقها في الموقع!');
        }
        UI.btnFuel.disabled = false;
    };

    // 3. Image Upload (Media Manager)
    UI.fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            UI.imgPreview.src = URL.createObjectURL(file);
            UI.imgPreview.style.display = 'block';
        }
    };

    UI.btnUpload.onclick = async () => {
        const file = UI.fileInput.files[0];
        if (!file) { showMsg('الرجاء اختيار صورة أولاً', 'err'); return; }
        
        UI.btnUpload.disabled = true;
        showMsg('جارِ رفع الصورة...');
        
        // Generate unique filename to avoid caching issues
        const ext = file.name.split('.').pop();
        const fileName = `hero_${Date.now()}.${ext}`;

        // Upload to Storage
        const { data, error } = await client.storage.from('media').upload(fileName, file, { upsert: true });
        
        if (error) {
            showMsg('فشل الرفع: ' + error.message, 'err');
        } else {
            // Get public URL
            const { data: urlData } = client.storage.from('media').getPublicUrl(fileName);
            // Save URL to site_content table so index.html knows what image to show
            await client.from('site_content').upsert({ id: 'hero_image', value: { url: urlData.publicUrl } });
            
            showMsg('تم تغيير صورة الكازية بنجاح!');
            UI.fileInput.value = '';
            UI.imgPreview.style.display = 'none';
            UI.btnRevert.style.display = 'block'; // Show revert button
        }
        UI.btnUpload.disabled = false;
    };

    // Revert Image (Delete from DB to fall back to default Video)
    UI.btnRevert.onclick = async () => {
        if (!confirm('هل أنت متأكد أنك تريد حذف الصورة والعودة لفيديو الخلفية الأصلي؟')) return;
        
        UI.btnRevert.disabled = true;
        showMsg('جارِ الحذف والعودة للفيديو...');
        
        // Remove from DB (we just delete the row)
        const { error } = await client.from('site_content').delete().eq('id', 'hero_image');
        
        if (error) {
            showMsg('فشل الحذف: ' + error.message, 'err');
            UI.btnRevert.disabled = false;
        } else {
            showMsg('تم الحذف! سيعرض الموقع الآن فيديو الخلفية الأصلي.');
            UI.btnRevert.style.display = 'none';
            UI.btnRevert.disabled = false;
        }
    };

    // Run on startup
    checkUser();
</script>
</body>
</html>
