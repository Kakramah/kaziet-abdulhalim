<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FACC15" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Base Shield / Rounded Background -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#darkGrad)" stroke="#334155" stroke-width="2.5"/>
  
  <!-- Canopy Roof -->
  <path d="M22 46 L98 46 L90 32 L30 32 Z" fill="url(#yellowGrad)" filter="url(#glow)"/>
  <rect x="22" y="44" width="76" height="5" rx="2" fill="#CA8A04"/>

  <!-- Station Pillars -->
  <rect x="36" y="49" width="7" height="38" rx="2" fill="#E2E8F0"/>
  <rect x="77" y="49" width="7" height="38" rx="2" fill="#E2E8F0"/>

  <!-- Ground Island -->
  <rect x="26" y="87" width="68" height="7" rx="3.5" fill="#334155"/>

  <!-- Fuel Dispenser (Pump) in Center -->
  <rect x="47" y="55" width="26" height="32" rx="4" fill="#0F172A" stroke="url(#yellowGrad)" stroke-width="2"/>
  <rect x="52" y="60" width="16" height="8" rx="1.5" fill="#22C55E"/>
  <circle cx="56" cy="74" r="2" fill="#FACC15"/>
  <circle cx="64" cy="74" r="2" fill="#38BDF8"/>
  
  <!-- Nozzle & Hose -->
  <path d="M73 66 C79 66, 80 72, 79 78 L80 82" fill="none" stroke="url(#yellowGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fuel Drop Crest Accent -->
  <path d="M60 16 C60 16, 50 26, 50 30 C50 35.5, 54.5 40, 60 40 C65.5 40, 70 35.5, 70 30 C70 26, 60 16, 60 16 Z" fill="url(#yellowGrad)" filter="url(#glow)"/>
</svg>
